detail: >-
  SPOTIO publishes no client libraries. Every public registry was searched for a
  first-party package and every one came back empty, and SPOTIO's own GitHub
  organisation (github.com/Spotio, verified by its blog field pointing at
  spotio.com) has zero public repositories. What the developer portal ships instead
  is copy-paste Python: the Authenticating, Paginating and Filtering articles each
  carry a worked `requests`-based class (token caching and renewal, scrollId
  pagination, filter creation). Those are documentation samples, not a distributed,
  versioned artifact - there is nothing for a consumer to pin, and no release date
  from which to read maintenance.

