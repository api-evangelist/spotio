prices_published: false

description: >-
  SPOTIO publishes plan NAMES but no prices. The plans page at spotio.com/plans lists
  three tiers - B2B, B2C and Custom - with a feature grid per tier and the single line
  "Pricing is user-based. View add-ons below for additional benefits", behind a
  "Download PDF" link. No dollar amount, no billing period and no user minimum appears
  anywhere on the page. Every tier routes to a demo request. Notably, API access, the
  Open API and webhooks are named on NONE of the three tiers, even though SPOTIO ships a
  295-operation REST API, a signed webhook system and a remote MCP server - so which
  subscription entitles a customer to the API cannot be established from SPOTIO's own
  published pricing.

notes: >-
  This artifact was rewritten on 2026-08-13. The previous version carried three tiers
  named Team / Business / Pro at $39 / $69 / $129 per user per month, sourced from
  third-party pricing aggregators (G2, Capterra). Those tier names do not appear on
  SPOTIO's own pricing page, and unverified aggregator figures were being presented as
  SPOTIO's published plans. They are retained under unverified_third_party below so
  nothing is lost, but they are no longer asserted as SPOTIO's pricing.

