- fetched: '2026-08-13'
  url: https://app.spotio2.com/mcp
  method: POST
  body: '{"jsonrpc":"2.0","id":1,"method":"tools/list"}'
  http_status: 401
  response_body: 'Unauthorized: Missing SPOTIO-MCP-KEY header or mcpkey query parameter'
- fetched: '2026-08-13'
  url: https://app.spotio2.com/mcp
