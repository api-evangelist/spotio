- https://mcp.spotio2.com (DNS NXDOMAIN)
- https://api.spotio2.com/api/mcp (404)
- npm / PyPI: no first-party @spotio MCP package published

third_party:
- name: Zapier MCP - Spotio
  url: https://zapier.com/mcp/spotio2
  official: false
  note: >-
    Zapier exposes SPOTIO actions through Zapier's own MCP endpoint. It is
    Zapier's server wrapping SPOTIO, not a SPOTIO-published one, and is recorded
    here only so it is not mistaken for the first-party server above.
