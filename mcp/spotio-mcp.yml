  http_status: 401
  response_body: 'Unauthorized: Missing SPOTIO-MCP-KEY header or mcpkey query parameter'
- fetched: '2026-08-13'
  url: https://api.spotio2.com/mcp
  http_status: 405
  note: production API host rejects the method; the MCP server is on the app host
- source: openapi/_original/spotio-swagger.json
  kind: openapi-tag
  detail: tag `Mcp`, 4 operations under /api/Mcp/keys/*

not_found:
