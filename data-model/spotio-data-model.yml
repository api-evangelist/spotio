summary: >-
  SPOTIO's data model is unusual and it is the single most important thing an
  integrator has to understand: there is no fixed Lead or Deal entity. There is one
  polymorphic record - the DataObject - whose type, stages and every field are
  defined per tenant in a Workflow. A DataObject writes address its fields by numeric
  fieldId, so nothing can be written until the tenant's workflow has been read. That
  is why the entity graph below has Workflow at its centre rather than Lead: the
  workflow is the schema, and it is data, not code.

id_conventions:
- entity: DataObject
  form: 24-character hexadecimal string (e.g. "679bb68913684f5c4e2ca6db")
  note: opaque; not an integer
- entity: Workflow field
  form: numeric string; system fields are high-numbered (100004 = Company, 100013 = Last Name), tenant custom fields are low-numbered
- entity: Stage
  form: numeric string; stageId defaults to "1" when omitted on create
- entity: User
  form: numeric string (ownerId)
- entity: DataObject type
  form: numeric string (typeId); required on create

