caveats:
- >-
  Component schemas carry .NET namespace names
  (Spotio.Frontend.ViewModel.DataObjects.*), generated by Swashbuckle. They are
  implementation identifiers, not a published domain vocabulary, so entity names here
  are taken from the tag/product surface rather than from schema keys.
- >-
  The document has 32 dangling $refs, all of them generic JsonPatchDocument
  constructions the generator failed to name legally. They are an upstream defect and
  are carried faithfully rather than repaired.
- >-
  "Lead" appears in the webhook event names (lead.added) and in Activity.leadId, but
  no Lead entity exists in the API - it is a DataObject of the tenant's lead type. An
  integration written against the webhook vocabulary must resolve back to DataObjects.
