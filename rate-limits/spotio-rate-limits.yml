related_throughput_controls:
  - control: bulk jobs
    detail: >-
      SPOTIO's stated reason for the DataObjectsBulkJobs surface is to avoid
      per-record calls - "instead of making individual API calls for each record,
      you can batch thousands of records into a single job". That is throughput
      guidance rather than a published limit, but it is the closest thing SPOTIO
      offers to a volume policy.
    docs: https://developer.spotio2.com/docs/spotio2/8zeggtfnhfk9t-working-with-bulk-jobs
  - control: webhook delivery
    detail: >-
      On the outbound side SPOTIO does publish delivery limits - each webhook POST
      times out after 10 seconds and is retried up to 3 times with increasing
      intervals. That governs SPOTIO calling you, not you calling SPOTIO.
    docs: https://support.spotio.com/hc/en-us/articles/360057063834-Webhooks
  - control: export polling
    detail: >-
      CSV exports are submit-then-poll with no documented minimum poll interval.

