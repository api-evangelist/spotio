detail: >-
  SPOTIO publishes no rate limits. Every article on the developer portal was read
  (Introduction, Authenticating, Paginating and Sorting, Status Codes and Errors,
  Filtering Collections, Working with DataObjects, Creating DataObjects, Working
  with Exports, Working With Bulk Jobs) and none names a quota, a window, a burst
  allowance or a throttling policy. The SPOTIO 2.0 OpenAPI declares 295 operations
  and not one of them declares a 429 response; the string "429" and every
  RateLimit/Retry-After header spelling are absent from the whole document. An
  agent therefore has no runtime signal to back off on, which is the finding.

