  note: >-
    No X-RateLimit-Limit / X-RateLimit-Remaining / X-RateLimit-Reset, no RFC 9238
    RateLimit-* and no Retry-After is documented or declared. Live observation is
    not possible anonymously - every SPOTIO endpoint requires a Bearer token and
    answers 401 without one.

