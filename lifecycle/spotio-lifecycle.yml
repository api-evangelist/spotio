status_page:
  url: https://status.spotio2.com/
  http_status: 200
  platform: self-hosted (Vue single-page app identifying itself as "spotio-status")
  machine_readable: false
  feeds: []
  detail: >-
    The status page is a client-rendered SPA. There is no Statuspage/Instatus JSON
    API and no RSS or Atom feed - /api/v2/summary.json, /api/v2/status.json,
    /summary.json and /history.rss all return 404, so an agent cannot read SPOTIO's
    incident state programmatically.

