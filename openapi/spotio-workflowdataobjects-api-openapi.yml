components:
  schemas:
    Spotio.CompanySettings.Client.DTO.Workflow.ScoringTypeDto:
      type: string
      enum:
      - Lead
      - Churn
    Spotio.CompanySettings.Client.DTO.Workflow.FieldRoleDto:
      type: string
      enum:
      - Name
      - Location
    Spotio.Frontend.ViewModel.Workflow.DataObjects.DataObjectRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type:
          - string
          - 'null'
          description: Name of the data object
        parentId:
          type:
          - string
          - 'null'
          description: Parent data object ID, in case if new data object definition should be nested inside other data object type
        extraSettings:
          $ref: '#/components/schemas/Spotio.Frontend.ViewModel.Workflow.DataObjects.DataObjectExtraRequest'
        inheritOwnerFromParent:
          type: boolean
          description: Should objects created from this definition inherit owner from parent objects
        scoringType:
          $ref: '#/components/schemas/Spotio.CompanySettings.Client.DTO.Workflow.ScoringTypeDto'
        parentRequired:
          type:
          - boolean
          - 'null'
          description: Indicates if a parent is required for the data object
    Spotio.Frontend.ViewModel.Workflow.DataObjects.DataObjectUpdateRequest:
      type: object
      additionalProperties: false
      properties:
        name:
          type:
          - string
          - 'null'
          description: Name of the data object
        extraSettings:
          $ref: '#/components/schemas/Spotio.Frontend.ViewModel.Workflow.DataObjects.DataObjectExtraRequest'
        inheritOwnerFromParent:
          type: boolean
          description: Inherit owner from parent data object
        scoringType:
          $ref: '#/components/schemas/Spotio.CompanySettings.Client.DTO.Workflow.ScoringTypeDto'
        parentRequired:
          type:
          - boolean
          - 'null'
          description: Indicates if a parent is required for the data object
    Spotio.Frontend.ViewModel.Workflow.Fields.Field:
      type: object
      description: Represents a field for a data object
      additionalProperties: false
      properties:
        id:
          type:
          - string
          - 'null'
          description: The unique identifier of the field
        name:
          type:
          - string
          - 'null'
          description: The name of the field
        type:
          $ref: '#/components/schemas/Spotio.CompanySettings.Contract.DTO.CustomFields.CustomFieldType'
        stageConstraints:
          type:
          - array
          - 'null'
          description: The list of stage constraints
          items:
            type: string
        createdAt:
          type: string
          description: The date and time the field was created
          format: date-time
        updatedAt:
          type: string
          description: The date and time the field was last updated
          format: date-time
        readonly:
          type: boolean
          description: Indicates if the field is read-only
        useAsFilter:
          type: boolean
          description: Indicates if the field should be used as a filter
        activeOptions:
          type:
          - array
          - 'null'
          description: The list of active options for the field
          items:
            type: string
        removedOptions:
          type:
          - array
          - 'null'
          description: The list of removed options for the field
          items:
            type: string
        showInActivityFeed:
          type: boolean
          description: Indicates if the field should be shown in the activity feed
        role:
          $ref: '#/components/schemas/Spotio.CompanySettings.Client.DTO.Workflow.FieldRoleDto'
        stageVisibility:
          type:
          - array
          - 'null'
          description: The list of stage visibility settings
          items:
            type: string
        systemRole:
          $ref: '#/components/schemas/Spotio.CompanySettings.Client.DTO.Workflow.FieldSystemRoleDto'
        requiredWithoutStage:
          type: boolean
          description: Indicates if the field is required without a stage
        inherited:
          type: boolean
          description: Indicates if the field's value is inherited from parent object
        inheritable:
          type: boolean
          description: Indicates if the field's value can be inherited from parent object
    Spotio.Frontend.ViewModel.Workflow.DataObjects.SetDefaultDataObjectRequest:
      type: object
      additionalProperties: false
      properties:
        dataObjectId:
          type:
          - string
          - 'null'
          description: Unique identifier of the data object definition
    Spotio.CompanySettings.Client.DTO.Workflow.FieldSystemRoleDto:
      type: string
      enum:
      - Company
      - FirstName
      - LastName
      - Phone
      - Email
      - Value
      - Unit
      - Address
      - LossReasons
      - LeadMachine
    Spotio.Frontend.ViewModel.Workflow.Stages.StagesResponse:
      type: object
      additionalProperties: false
      properties:
        active:
          $ref: '#/components/schemas/Spotio.Frontend.ViewModel.Workflow.Stages.StagesGroupResponse'
        won:
          $ref: '#/components/schemas/Spotio.Frontend.ViewModel.Workflow.Stages.StagesGroupResponse'
        lost:
          $ref: '#/components/schemas/Spotio.Frontend.ViewModel.Workflow.Stages.StagesGroupResponse'
    Spotio.Frontend.ViewModel.Workflow.Settings.DataObjectDefinition:
      type: object
      additionalProperties: false
      properties:
        hasAddress:
          type: boolean
          description: Indicates if the data object definition has an address
        fields:
          type:
          - array
          - 'null'
          description: List of fields in the data object definition
          items:
            $ref: '#/components/schemas/Spotio.Frontend.ViewModel.Workflow.Fields.Field'
        stages:
          $ref: '#/components/schemas/Spotio.Frontend.ViewModel.Workflow.Stages.StagesResponse'
        hasPhone:
          type: boolean
          description: Indicates if the data object definition has a phone field
          readOnly: true
        hasEmail:
          type: boolean
          description: Indicates if the data object definition has an email field
          readOnly: true
        id:
          type:
          - string
          - 'null'
          description: Unique identifier of the data object
        name:
          type:
          - string
          - 'null'
          description: Name of the data object
        parentId:
          type:
          - string
          - 'null'
          description: Parent data object ID
        extraSettings:
          $ref: '#/components/schemas/Spotio.Frontend.ViewModel.Workflow.DataObjects.DataObjectExtraSettings'
        inheritOwnerFromParent:
          type: boolean
          description: Inherit owner from parent data object
        scoringType:
          $ref: '#/components/schemas/Spotio.CompanySettings.Client.DTO.Workflow.ScoringTypeDto'
        parentRequired:
          type:
          - boolean
          - 'null'
          description: Indicates if a parent is required for the data object
    Spotio.Frontend.ViewModel.Workflow.Stages.Stage:
      type: object
      additionalProperties: false
      properties:
        id:
          type:
          - string
          - 'null'
          description: Unique identifier of the stage
        name:
          type:
          - string
          - 'null'
          description: Name of the stage
        color:
          type:
          - string
          - 'null'
          description: Color of the stage
        lossReasons:
          type:
          - array
          - 'null'
          description: List of loss reasons for the stage
          items:
            type: string
        scoringType:
          $ref: '#/components/schemas/Spotio.CompanySettings.Client.DTO.Workflow.ScoringTypeDto'
    Spotio.CompanySettings.Contract.DTO.CustomFields.CustomFieldType:
      type: string
      enum:
      - Email
      - Text
      - Phone
      - SingleChoice
      - MultiChoice
      - Date
      - Number
      - Address
      - Currency
      - DateTime
      - MultiLine
      - Attachment
    Spotio.Frontend.ViewModel.Workflow.DataObjects.DataObjectExtraRequest:
      type: object
      additionalProperties: false
      properties:
        allowAutoplays:
          type: boolean
          description: Determines if you are able to create autoplays for this type
        enableLeadMachine:
          type: boolean
          description: Should you be able to generate this objects using lead machine
    Spotio.Frontend.ViewModel.Workflow.DataObjects.DataObjectExtraSettings:
      type: object
      additionalProperties: false
      properties:
