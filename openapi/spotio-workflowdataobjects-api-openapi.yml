  /api/workflow/dataObjects/default:
    put:
      tags:
      - WorkflowDataObjects
      summary: Update the default data object for the current company
      parameters:
      - name: id
        in: query
        schema:
          type: integer
          format: int32
      requestBody:
        content:
          application/merge-patch+json:
            schema:
              $ref: '#/components/schemas/Spotio.Frontend.ViewModel.Workflow.DataObjects.SetDefaultDataObjectRequest'
          application/json-patch+json:
            schema:
              $ref: '#/components/schemas/Spotio.Frontend.ViewModel.Workflow.DataObjects.SetDefaultDataObjectRequest'
          application/json:
