      summary: Get attachment by id.
      parameters:
      - name: id
        in: path
        description: Attachment id.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
        '404':
          description: Not Found
      security:
      - Bearer: []
      servers:
      - url: https://api.spotio2.com
        description: Production
      - url: https://app-test.spotio2.com
        description: Test
  /api/Communication/search:
    get:
      tags:
      - Communication
      summary: Search records for communication.
      parameters:
      - name: q
        in: query
        description: Text query
        schema:
          type: string
      - name: phoneNumber
        in: query
        description: Phone number
        schema:
          type: string
      - name: scrollId
        in: query
        description: Scroll id for pagination
        schema:
          type: string
      - name: filterId
        in: query
        description: Reference to the saved filter
        schema:
          type: string
      - name: sortBy
        in: query
        schema:
          type: string
      - name: includeRecentCall
        in: query
        description: If true recent call is included in the results
        schema:
          type: boolean
      - name: dataObjectTypeId
        in: query
        description: Id of data object type
        schema:
          type: integer
          format: int32
      - name: hasPhoneOrEmail
        in: query
        description: If true, will return objects with phone or email
        schema:
          type: boolean
      - name: hasPhone
        in: query
        description: If true, will return objects with phone
        schema:
          type: boolean
      - name: hasEmail
        in: query
        description: If true, will return objects with email
        schema:
          type: boolean
      - name: hasPhoneField
        in: query
        description: If true, will return object type with phone in definition
        schema:
          type: boolean
      - name: hasEmailField
        in: query
        description: If true, will return object type with email in definition
        schema:
          type: boolean
      responses:
        '200':
          description: Success
          content:
            text/plain:
              schema:
