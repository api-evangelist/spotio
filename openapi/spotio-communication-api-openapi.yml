            application/json:
              schema:
                $ref: '#/components/schemas/ResultType.Results.Error'
            text/json:
              schema:
                $ref: '#/components/schemas/ResultType.Results.Error'
        '401':
          description: Unauthorized
      security:
      - Bearer: []
      servers:
      - url: https://api.spotio2.com
        description: Production
      - url: https://app-test.spotio2.com
        description: Test
  /api/Communication/texts/{id}/read:
    post:
      tags:
      - Communication
      summary: Mark thread as read.
      parameters:
      - name: id
        in: path
        description: Activity reference.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Success
      security:
      - Bearer: []
      servers:
      - url: https://api.spotio2.com
        description: Production
      - url: https://app-test.spotio2.com
        description: Test
  /api/Communication/mails/{id}/read:
    post:
      tags:
      - Communication
      summary: Mark mail as read.
      parameters:
      - name: id
        in: path
        description: Activity reference.
        required: true
        schema:
          type: string
      responses:
        '200':
