openapi: 3.2.0
info:
  version: v1
  title: Spotio 2.0 Reports API
  description: The controller is responsible exporting data by selected report type.
  contact:
    name: Contact us
    url: https://spotio.com/contact/
    email: support@spotio.com
servers:
- url: https://api.spotio2.com
  description: Production
- url: https://app-test.spotio2.com
