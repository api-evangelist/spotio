components:
  schemas:
    Spotio.Frontend.ViewModel.Reports.ChartLegacyRequestDto:
      type: object
      description: Represents the request data for legacy dashboard charts.
      additionalProperties: false
      properties:
        leadId:
          type:
          - string
          - 'null'
          description: The ID of the lead to filter the chart by. [deprecated]
        dataObjectId:
          type:
          - string
          - 'null'
          description: The ID of the data object to filter the chart by.
        singleType:
          type:
          - integer
          - 'null'
          description: The ID of the single type (from workflow settings) to filter the chart by.
          format: int32
        lostStageId:
          type:
          - integer
          - 'null'
          description: The ID of the lost stage to filter the chart by.
          format: int32
        type:
          type:
          - string
          - 'null'
        companyId:
          type:
          - string
          - 'null'
        filters:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/Spotio.Dashboard.Contract.Legacy.ILegacyFilter'
        scrollId:
          type:
          - string
          - 'null'
        by:
          type:
          - string
          - 'null'
        steps:
          type:
          - string
          - 'null'
        orderBy:
          type:
          - string
          - 'null'
        projections:
          type:
          - array
          - 'null'
          items:
            $ref: '#/components/schemas/Spotio.Dashboard.Contract.RequestProjection'
    Spotio.Dashboard.Contract.RequestProjection:
      type: object
      additionalProperties: false
      properties:
        data:
          type:
          - string
          - 'null'
        type:
          type:
          - string
          - 'null'
    Spotio.Dashboard.Contract.Legacy.ILegacyFilter:
      type: object
      additionalProperties: false
      properties:
        type:
          type:
          - string
          - 'null'
    Spotio.Exports.Client.Model.Export:
      type: object
      additionalProperties: false
      properties:
        id:
          type:
          - string
          - 'null'
        updatedAt:
          type:
          - string
          - 'null'
          format: date-time
        createdAt:
          type: string
          format: date-time
        state:
          $ref: '#/components/schemas/Spotio.Exports.Client.Model.ExportState'
        url:
          type:
          - string
          - 'null'
        typeName:
          type:
          - string
          - 'null'
        filterId:
          type:
          - string
          - 'null'
        territoryId:
          type:
          - integer
          - 'null'
          format: int32
        startDate:
          type:
          - string
          - 'null'
          format: date-time
        endDate:
          type:
          - string
          - 'null'
          format: date-time
    Spotio.Exports.Client.Model.ExportState:
      type: string
      enum:
      - Preparing
      - Ready
  securitySchemes:
    Bearer:
      type: apiKey
      description: 'Enter the Bearer Authorization string as following: `Bearer Generated-JWT-Token`'
      name: Authorization
      in: header
