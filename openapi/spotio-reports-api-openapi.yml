          - DataObjectsCreatedByUsers
          - DataObjectsCreatedByTerritoriesOverTime
          - DataObjectsCreatedByUsersOverTime
          - DataObjectsCreatedByTerritories
          - ConversionResultCount
          - CommunicationConversionByVoice
          - CommunicationConversionByEmail
          - CommunicationConversionByText
          - CommunicationLog
          - CommunicationMetricsOverview
          - CommunicationMetricsOverTime
          - CommunicationMetricsByTextTemplates
          - CommunicationMetricsByMailTemplates
          - VisitsDuration
          - VisitsDurationByDataObject
          - TimeAllocation
          - UserDetails
          - TerritoryDetails
          - TeamDetails
          - TodayStats
          - ScheduleStats
