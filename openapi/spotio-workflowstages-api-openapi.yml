  /api/workflow/dataObjects/{dataObjectId}/stages/{group}/{stageId}/move:
    post:
      tags:
      - WorkflowStages
      summary: Move stage to another group
      description: Moves a workflow stage to another group within a specified data object type.
      parameters:
      - name: dataObjectId
        in: path
        required: true
        schema:
          type: integer
          format: int32
      - name: group
        in: path
        required: true
        schema:
