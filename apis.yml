name: SPOTIO
kind: company
description: SPOTIO is a field sales engagement and territory management platform for
  outside sales teams - lead and prospect tracking, activity logging, territory
  mapping and assignment, route optimization, appointment setting, and pipeline
  visibility, delivered through a mobile-first field app and a web console. For
  custom integrations beyond its native Salesforce, HubSpot, Microsoft Dynamics 365,
  Pipedrive, and Zapier connectors, SPOTIO publishes a documented Open REST API and
  outbound webhooks. The developer portal (developer.spotio2.com, powered by
  Stoplight) covers a curl quickstart and token authentication; full endpoint
  reference access is oriented toward enterprise customers with an API key, so the
  logical APIs below are honestly modeled from SPOTIO's documented product surface
  and webhook event catalog rather than a published OpenAPI definition.
