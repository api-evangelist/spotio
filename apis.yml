aid: spotio
url: https://raw.githubusercontent.com/api-evangelist/spotio/refs/heads/main/apis.yml
name: SPOTIO
kind: company
description: 'SPOTIO is a field sales engagement and territory management platform for outside sales teams - lead
  and prospect tracking, activity logging, territory mapping and assignment, route optimization, appointment setting,
  and pipeline visibility, delivered through a mobile-first field app and a web console. Behind that product is
  a substantial and genuinely public API: SPOTIO 2.0 is an OpenAPI 3.0.1 contract of 238 paths and 295 operations
  across 39 capabilities, published from SPOTIO''s own Stoplight project at developer.spotio2.com and exportable
  without authentication. Authentication is a bearer JWT minted from a clientId/secret pair; collections page on
  a scrollId cursor; and SPOTIO''s data model is polymorphic - there is no fixed Lead entity, only a tenant-defined
  DataObject whose types, stages and fields are read from a Workflow before anything can be written. SPOTIO also
  operates a first-party remote MCP server at app.spotio2.com/mcp, authenticated with a SPOTIO-MCP-KEY that the
  API itself mints, plus a signed outbound webhook system covering ten lead, activity and appointment events. It
  publishes no SDK in any language, no idempotency contract, no rate limits and no security.txt.'
