  schemas:
  - Spotio.Infrastructure.Common.DataModel.Error.Error
  - ResultType.Results.Error
  notes:
  - SPOTIO does NOT use RFC 9457 application/problem+json. Errors come back as a plain `errors` object
    keyed by field name.
  - Validation errors on the entity itself (rather than a field) are keyed with "_".
  - For large DataObject writes a client may supply a `fieldTempId` per field; SPOTIO echoes that fieldTempId
    back as the error key so the message can be bound to the right input.
  examples:
  - operation: POST /api/DataObjects
    body: '{"errors": {"stageId": "Stage with id: 3 does not exist."}}'
  - operation: DELETE /collection/{id}
    body: '{"errors": {"_": "Cannot delete the last item in the collection"}}'
